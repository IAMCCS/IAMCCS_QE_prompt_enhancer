<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="white"/>
  <!-- Slow motion effect - overlapping frames -->
  <g stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Multiple motion frames -->
    <circle cx="20" cy="32" r="4" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>
    <circle cx="24" cy="32" r="4" fill="none" stroke="#000" stroke-width="1" opacity="0.5"/>
    <circle cx="28" cy="32" r="4" fill="none" stroke="#000" stroke-width="1" opacity="0.6"/>
    <circle cx="32" cy="32" r="4" fill="none" stroke="#000" stroke-width="1.5"/>
    <circle cx="36" cy="32" r="4" fill="none" stroke="#000" stroke-width="1" opacity="0.6"/>
    <circle cx="40" cy="32" r="4" fill="none" stroke="#000" stroke-width="1" opacity="0.5"/>
    <circle cx="44" cy="32" r="4" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>
    <!-- Speed indicator -->
    <path d="M 48 20 L 52 24 L 50 32 L 52 40 L 48 44" fill="none" stroke="#000" stroke-width="1"/>
  </g>
</svg>
