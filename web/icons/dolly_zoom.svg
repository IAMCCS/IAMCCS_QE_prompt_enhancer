<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="white"/>
  <!-- Dolly zoom - opposing motion -->
  <g stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Convergence lines forward -->
    <line x1="12" y1="12" x2="28" y2="28"/>
    <line x1="12" y1="52" x2="28" y2="36"/>
    <line x1="52" y1="12" x2="36" y2="28"/>
    <line x1="52" y1="52" x2="36" y2="36"/>
    <!-- Subject maintaining position -->
    <circle cx="32" cy="32" r="6" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Direction indicators -->
    <path d="M 20 8 L 16 12 L 20 16" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M 44 8 L 48 12 L 44 16" fill="none" stroke="#000" stroke-width="1"/>
  </g>
</svg>
