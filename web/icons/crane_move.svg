<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="white"/>
  <!-- Crane camera descent -->
  <g stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Crane arm -->
    <line x1="32" y1="6" x2="32" y2="26" stroke="#000" stroke-width="2"/>
    <!-- Camera on crane -->
    <rect x="28" y="22" width="8" height="6" rx="1" stroke="#000" stroke-width="1.5"/>
    <circle cx="32" cy="25" r="2" fill="none" stroke="#000" stroke-width="1"/>
    <!-- Descent cable -->
    <line x1="32" y1="28" x2="32" y2="48" stroke="#000" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Characters below being revealed -->
    <circle cx="22" cy="50" r="3" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="42" cy="50" r="3" fill="none" stroke="#000" stroke-width="1"/>
    <!-- Ceiling -->
    <line x1="8" y1="8" x2="56" y2="8" stroke="#000" stroke-width="1.5"/>
  </g>
</svg>
