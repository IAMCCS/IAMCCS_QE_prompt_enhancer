<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="none"/>
  <!-- Image 1 with lit subject -->
  <rect x="12" y="16" width="16" height="16" fill="none" stroke="#000" stroke-width="1.5" rx="1"/>
  <circle cx="20" cy="24" r="3" fill="none" stroke="#000" stroke-width="1"/>
  <!-- Light rays from top left -->
  <line x1="12" y1="16" x2="8" y2="12" stroke="#000" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <!-- Image 2 -->
  <rect x="36" y="28" width="16" height="16" fill="none" stroke="#000" stroke-width="1.5" rx="1"/>
  <circle cx="44" cy="36" r="3" fill="none" stroke="#000" stroke-width="1"/>
  <!-- Copy arrow -->
  <path d="M 28 24 L 36 32" stroke="#000" stroke-width="1" stroke-linecap="round"/>
</svg>