<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="none"/>
  <!-- 35mm film frame -->
  <rect x="14" y="14" width="36" height="36" fill="none" stroke="#000" stroke-width="1.5" rx="2"/>
  <!-- Film perforations sides -->
  <rect x="12" y="22" width="2" height="3" fill="#000"/>
  <rect x="12" y="32" width="2" height="3" fill="#000"/>
  <rect x="50" y="22" width="2" height="3" fill="#000"/>
  <rect x="50" y="32" width="2" height="3" fill="#000"/>
  <!-- Warm midtone indication -->
  <circle cx="32" cy="32" r="6" fill="none" stroke="#000" stroke-width="1" opacity="0.6"/>
</svg>