<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="white"/>
  <!-- Camera drift - handheld camera motion -->
  <g stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Figure walking -->
    <circle cx="24" cy="18" r="4"/>
    <line x1="24" y1="22" x2="24" y2="32"/>
    <line x1="18" y1="26" x2="30" y2="26"/>
    <line x1="20" y1="32" x2="20" y2="42"/>
    <line x1="28" y1="32" x2="28" y2="42"/>
    <!-- Camera with motion lines -->
    <rect x="36" y="24" width="14" height="10" rx="1"/>
    <circle cx="43" cy="29" r="3" fill="none"/>
    <!-- Motion lines -->
    <path d="M 48 18 L 52 14" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 50 20 L 54 16" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
