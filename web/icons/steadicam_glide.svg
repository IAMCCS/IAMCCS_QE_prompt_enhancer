  <g stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Smooth curve path -->
    <path d="M 12 32 Q 32 20 52 32" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Camera symbol -->
    <rect x="28" y="26" width="8" height="6" rx="1"/>
