<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="none"/>
  <!-- House -->
  <rect x="20" y="24" width="16" height="16" fill="none" stroke="#000" stroke-width="1.5" rx="1"/>
  <!-- Snow roof -->
  <polygon points="20,24 28,16 36,24" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Snowflakes -->
  <circle cx="12" cy="12" r="0.8" fill="#000" opacity="0.6"/>
  <circle cx="48" cy="14" r="0.8" fill="#000" opacity="0.6"/>
  <circle cx="16" cy="48" r="0.8" fill="#000" opacity="0.6"/>
  <!-- Snow ground -->
  <line x1="10" y1="46" x2="54" y2="46" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
</svg>