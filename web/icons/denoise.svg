<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="none"/>
  <!-- Noisy dots -->
  <circle cx="24" cy="24" r="1" fill="#000" opacity="0.5"/>
  <circle cx="28" cy="22" r="1" fill="#000" opacity="0.5"/>
  <circle cx="26" cy="28" r="1" fill="#000" opacity="0.5"/>
  <!-- Clean area -->
  <rect x="30" y="16" width="20" height="20" fill="none" stroke="#000" stroke-width="1.5" rx="2"/>
  <!-- Brush/eraser -->
  <rect x="38" y="42" width="6" height="12" fill="none" stroke="#000" stroke-width="1.5" rx="1"/>
  <polygon points="38,42 44,42 46,40 36,40" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
</svg>