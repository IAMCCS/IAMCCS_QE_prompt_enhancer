<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="none"/>
  <!-- Face - one half lit, one half dark (split lighting) -->
  <circle cx="32" cy="28" r="11" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- Vertical center line (the split) -->
  <line x1="32" y1="17" x2="32" y2="39" stroke="#000" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <!-- Light hatch on lit side (left) -->
  <line x1="22" y1="22" x2="30" y2="24" stroke="#000" stroke-width="0.7" opacity="0.3"/>
  <line x1="22" y1="26" x2="30" y2="27" stroke="#000" stroke-width="0.7" opacity="0.3"/>
  <line x1="22" y1="30" x2="30" y2="30" stroke="#000" stroke-width="0.7" opacity="0.3"/>
  <!-- Dark hatch on shadow side (right) -->
  <line x1="34" y1="22" x2="41" y2="24" stroke="#000" stroke-width="0.7" opacity="0.15"/>
  <line x1="34" y1="26" x2="41" y2="27" stroke="#000" stroke-width="0.7" opacity="0.15"/>
  <line x1="34" y1="30" x2="41" y2="30" stroke="#000" stroke-width="0.7" opacity="0.15"/>
  <!-- Light source left -->
  <rect x="6" y="22" width="7" height="12" rx="2" fill="none" stroke="#000" stroke-width="1.2"/>
  <line x1="13" y1="26" x2="20" y2="26" stroke="#000" stroke-width="1" stroke-linecap="round"/>
  <line x1="13" y1="29" x2="20" y2="28" stroke="#000" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <!-- Figure body below -->
  <path d="M22 44 Q22 40 32 40 Q42 40 42 44" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Rembrandt triangle hint on shadow side -->
  <path d="M35 26 L38 28 L36 30 Z" fill="none" stroke="#000" stroke-width="0.8" opacity="0.5" stroke-linejoin="round"/>
</svg>
