<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="white"/>
  <!-- Reflection view - mirror effect -->
  <g stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Mirror line -->
    <line x1="32" y1="8" x2="32" y2="56" stroke="#000" stroke-width="2"/>
    <!-- Object (left) -->
    <circle cx="18" cy="28" r="5" fill="none" stroke="#000" stroke-width="1.5"/>
    <path d="M 18 18 L 18 24" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Reflection (right) -->
    <circle cx="46" cy="28" r="5" fill="none" stroke="#000" stroke-width="1.5"/>
    <path d="M 46 18 L 46 24" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Ground line -->
    <line x1="8" y1="48" x2="56" y2="48" fill="none" stroke="#000" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
