<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="none"/>
  <!-- Person silhouette (facing left so back is to light source on right) -->
  <circle cx="26" cy="26" r="6" fill="none" stroke="#000" stroke-width="1.5"/>
  <path d="M18 46 Q18 38 26 38 Q34 38 34 46" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sun/light source at right-back -->
  <circle cx="48" cy="16" r="7" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- Radial rays from sun -->
  <line x1="56" y1="16" x2="60" y2="16" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="53" y1="9" x2="56" y2="6" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="48" y1="8" x2="48" y2="4" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="44" y1="9" x2="42" y2="6" stroke="#000" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Halo rim light around person head -->
  <path d="M20 20 Q22 14 28 17 Q34 20 32 26" fill="none" stroke="#000" stroke-width="1" stroke-linecap="round" opacity="0.6" stroke-dasharray="2 2"/>
  <!-- Backlight halo around figure -->
  <path d="M34 24 Q42 18 46 26 Q50 34 44 44 Q38 54 26 50 Q14 46 14 36" fill="none" stroke="#000" stroke-width="1" stroke-linecap="round" opacity="0.4" stroke-dasharray="2 3"/>
</svg>
