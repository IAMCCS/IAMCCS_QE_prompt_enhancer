<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="none"/>
  <!-- Disco ball -->
  <circle cx="32" cy="22" r="10" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- Disco grid lines -->
  <line x1="22" y1="22" x2="42" y2="22" stroke="#000" stroke-width="0.8"/>
  <line x1="32" y1="12" x2="32" y2="32" stroke="#000" stroke-width="0.8"/>
  <line x1="23" y1="15" x2="41" y2="29" stroke="#000" stroke-width="0.7" opacity="0.5"/>
  <line x1="41" y1="15" x2="23" y2="29" stroke="#000" stroke-width="0.7" opacity="0.5"/>
  <!-- Light beams from disco ball -->
  <line x1="20" y1="28" x2="12" y2="42" stroke="#000" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="32" y1="32" x2="10" y2="50" stroke="#000" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
  <line x1="44" y1="28" x2="52" y2="42" stroke="#000" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="32" y1="32" x2="54" y2="50" stroke="#000" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
  <!-- Hanging wire -->
  <line x1="32" y1="8" x2="32" y2="12" stroke="#000" stroke-width="1" stroke-linecap="round"/>
  <!-- Floor reflection dots -->
  <circle cx="16" cy="56" r="1" fill="#000"/>
  <circle cx="32" cy="58" r="1" fill="#000"/>
  <circle cx="48" cy="56" r="1" fill="#000"/>
</svg>
