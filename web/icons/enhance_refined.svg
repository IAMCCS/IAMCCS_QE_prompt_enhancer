<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .icon-stroke { stroke: #2d3436; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill { fill: #2d3436; }
    </style>
  </defs>

  <!-- Main star with refined geometry -->
  <g>
    <!-- Center point -->
    <circle cx="32" cy="28" r="2.5" class="icon-fill"/>

    <!-- Top point -->
    <line x1="32" y1="28" x2="32" y2="10" class="icon-stroke"/>
    <circle cx="32" cy="8" r="2.5" class="icon-fill"/>

    <!-- Top-right point -->
    <line x1="32" y1="28" x2="44" y2="16" class="icon-stroke"/>
    <circle cx="46" cy="14" r="2.5" class="icon-fill"/>

    <!-- Bottom-right point -->
    <line x1="32" y1="28" x2="42" y2="44" class="icon-stroke"/>
    <circle cx="44" cy="46" r="2.5" class="icon-fill"/>

    <!-- Bottom point -->
    <line x1="32" y1="28" x2="32" y2="46" class="icon-stroke"/>
    <circle cx="32" cy="48" r="2.5" class="icon-fill"/>

    <!-- Bottom-left point -->
    <line x1="32" y1="28" x2="22" y2="44" class="icon-stroke"/>
    <circle cx="20" cy="46" r="2.5" class="icon-fill"/>

    <!-- Top-left point -->
    <line x1="32" y1="28" x2="22" y2="16" class="icon-stroke"/>
    <circle cx="20" cy="14" r="2.5" class="icon-fill"/>
  </g>

  <!-- Subtle outer ring -->
  <circle cx="32" cy="28" r="26" fill="none" stroke="#2d3436" stroke-width="1.5" opacity="0.3"/>
</svg>