<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="white"/>
  <!-- Lateral tracking motion -->
  <g stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Subject figure -->
    <circle cx="32" cy="16" r="4" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="32" y1="20" x2="32" y2="32"/>
    <line x1="24" y1="24" x2="40" y2="24"/>
    <line x1="28" y1="32" x2="28" y2="42"/>
    <line x1="36" y1="32" x2="36" y2="42"/>
    <!-- Tracking path -->
    <path d="M 16 32 L 48 32" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Direction arrows -->
    <path d="M 10 28 L 6 32 L 10 36" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M 54 28 L 58 32 L 54 36" fill="none" stroke="#000" stroke-width="1"/>
  </g>
</svg>
