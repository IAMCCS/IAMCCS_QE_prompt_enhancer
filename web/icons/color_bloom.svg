<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="white"/>
  <!-- Color bloom flare -->
  <g stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Bloom center -->
    <circle cx="32" cy="32" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Bloom halos -->
    <circle cx="32" cy="32" r="12" fill="none" stroke="#000" stroke-width="1" opacity="0.6"/>
    <circle cx="32" cy="32" r="16" fill="none" stroke="#000" stroke-width="1" opacity="0.3"/>
    <!-- Light rays -->
    <line x1="32" y1="8" x2="32" y2="4" stroke="#000" stroke-width="1"/>
    <line x1="56" y1="32" x2="60" y2="32" stroke="#000" stroke-width="1"/>
    <line x1="32" y1="56" x2="32" y2="60" stroke="#000" stroke-width="1"/>
    <line x1="8" y1="32" x2="4" y2="32" stroke="#000" stroke-width="1"/>
  </g>
</svg>
