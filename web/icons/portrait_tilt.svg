<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="white"/>
  <!-- Portrait focus tilt - depth of field -->
  <g stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Blurred background (top) -->
    <circle cx="20" cy="16" r="4" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>
    <circle cx="44" cy="20" r="3" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>
    <!-- Sharp face (center) -->
    <circle cx="32" cy="32" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="28" y1="30" x2="28" y2="30" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36" y1="30" x2="36" y2="30" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 28 36 Q 32 38 36 36" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Blurred foreground (bottom) -->
    <circle cx="24" cy="48" r="5" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>
    <circle cx="48" cy="50" r="4" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>
  </g>
</svg>
