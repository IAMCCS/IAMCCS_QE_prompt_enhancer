<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Camera following from behind -->
  <g stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Subject figure (front view, simple) -->
    <circle cx="32" cy="16" r="5" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="32" y1="22" x2="32" y2="34" stroke="#000" stroke-width="1.5"/>
    <line x1="24" y1="26" x2="40" y2="26" stroke="#000" stroke-width="1.5"/>
    <line x1="28" y1="34" x2="28" y2="44" stroke="#000" stroke-width="1.5"/>
    <line x1="36" y1="34" x2="36" y2="44" stroke="#000" stroke-width="1.5"/>
    <!-- Camera behind (small rectangle) -->
    <rect x="26" y="48" width="12" height="8" rx="1" fill="none" stroke="#000" stroke-width="1.5"/>
    <circle cx="32" cy="52" r="2" fill="none" stroke="#000" stroke-width="1"/>
  </g>
</svg>
