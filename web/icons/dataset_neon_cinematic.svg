<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="none"/>
  <!-- Vertical neon tube -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Horizontal neon tube -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Diagonal crossings for neon glow -->
  <line x1="16" y1="16" x2="24" y2="24" stroke="#000" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="48" y1="16" x2="40" y2="24" stroke="#000" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="16" y1="48" x2="24" y2="40" stroke="#000" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="48" y1="48" x2="40" y2="40" stroke="#000" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <!-- Center glow node -->
  <circle cx="32" cy="32" r="4" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="8" fill="none" stroke="#000" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 3"/>
</svg>
