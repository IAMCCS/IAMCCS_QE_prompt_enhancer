<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .outline { stroke: #2d3436; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .solid { fill: #2d3436; }
    </style>
  </defs>

  <!-- Camera body -->
  <rect x="12" y="20" width="40" height="28" rx="3" class="outline"/>

  <!-- Camera lens -->
  <circle cx="32" cy="34" r="10" class="outline"/>
  <circle cx="32" cy="34" r="6" class="outline"/>

  <!-- Viewfinder decoration -->
  <g class="outline">
    <line x1="16" y1="24" x2="20" y2="24"/>
    <line x1="44" y1="24" x2="48" y2="24"/>
  </g>

  <!-- Focus frame - portrait centered -->
  <rect x="22" y="14" width="20" height="26" rx="2" class="outline" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Light accent dots indicating camera capability -->
  <circle cx="42" cy="26" r="1.5" class="solid"/>
  <circle cx="44" cy="28" r="1.5" class="solid" opacity="0.5"/>
</svg>