<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="white"/>
  <!-- Horizontal pan motion -->
  <g stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Scene frame -->
    <rect x="12" y="20" width="40" height="24" rx="2"/>
    <!-- Subject moving -->
    <circle cx="20" cy="32" r="4" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Objects revealed -->
    <rect x="36" y="26" width="6" height="12" fill="none" stroke="#000" stroke-width="1.5"/>
    <polygon points="46,32 44,26 48,26" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Pan direction arrow -->
    <path d="M 8 32 L 2 32 M 4 28 L 2 32 L 4 36" fill="none" stroke="#000" stroke-width="1.5"/>
  </g>
</svg>
