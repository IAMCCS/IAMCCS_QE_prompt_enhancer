<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="none"/>
  <!-- Light source -->
  <circle cx="48" cy="16" r="5" fill="#000"/>
  <!-- Flare rays (blue streaks) -->
  <line x1="48" y1="16" x2="32" y2="32" stroke="#000" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
  <line x1="48" y1="16" x2="20" y2="40" stroke="#000" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <!-- Lens rings -->
  <circle cx="32" cy="32" r="6" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>
</svg>