<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="none"/>
  <!-- Rotated square representing 45° angle -->
  <rect x="20" y="20" width="24" height="24" fill="none" stroke="#000" stroke-width="1.5" transform="rotate(45 32 32)"/>
  <!-- Arrow indicating right rotation -->
  <path d="M 48 32 L 54 32" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 52 28 L 54 32 L 52 36" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>