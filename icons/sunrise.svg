<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="none"/>
  <!-- Sun at horizon -->
  <circle cx="32" cy="38" r="10" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- Horizon line -->
  <line x1="12" y1="40" x2="52" y2="40" stroke="#000" stroke-width="1.5"/>
  <!-- Light rays -->
  <line x1="20" y1="32" x2="16" y2="26" stroke="#000" stroke-width="1" opacity="0.6"/>
  <line x1="44" y1="32" x2="48" y2="26" stroke="#000" stroke-width="1" opacity="0.6"/>
  <!-- Land -->
  <line x1="12" y1="50" x2="52" y2="50" stroke="#000" stroke-width="2" stroke-linecap="round"/>
</svg>