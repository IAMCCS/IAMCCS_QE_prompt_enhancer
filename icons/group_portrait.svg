<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="none"/>
  <!-- Frame -->
  <rect x="12" y="12" width="40" height="40" fill="none" stroke="#000" stroke-width="1.5" rx="2"/>
  <!-- Three faces arranged -->
  <circle cx="22" cy="26" r="5" fill="none" stroke="#000" stroke-width="1.5"/>
  <circle cx="32" cy="20" r="5" fill="none" stroke="#000" stroke-width="1.5"/>
  <circle cx="42" cy="26" r="5" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- Bodies -->
  <line x1="22" y1="31" x2="22" y2="42" stroke="#000" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="25" x2="32" y2="42" stroke="#000" stroke-width="1" opacity="0.6"/>
  <line x1="42" y1="31" x2="42" y2="42" stroke="#000" stroke-width="1" opacity="0.6"/>
</svg>