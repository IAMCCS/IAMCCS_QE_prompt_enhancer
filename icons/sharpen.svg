<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" fill="none"/>
  <!-- Sharp triangle/blade shape -->
  <polygon points="32,16 44,48 20,48" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Center line indicating sharpness -->
  <line x1="32" y1="20" x2="32" y2="44" stroke="#000" stroke-width="1"/>
  <!-- Edge indicators -->
  <line x1="20" y1="46" x2="16" y2="50" stroke="#000" stroke-width="1" opacity="0.5"/>
  <line x1="44" y1="46" x2="48" y2="50" stroke="#000" stroke-width="1" opacity="0.5"/>
</svg>