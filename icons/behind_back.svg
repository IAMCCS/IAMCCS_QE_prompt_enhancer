  <!-- Arms swinging -->
  <line x1="32" y1="25" x2="20" y2="32" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="25" x2="44" y2="32" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="28" y1="38" x2="28" y2="50" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="38" x2="36" y2="50" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
</svg>